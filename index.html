<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2236">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jack-up 그래프</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#12212f;--mut:#5b6b7a;--line:#d5dce3;--in:#f6f8fa;--navy:#0e2236;--amb:#f2a900;--ok:#1f8a5b;--bad:#c8402f;--teal:#1b7f9e}
@media(prefers-color-scheme:dark){:root{--bg:#0a1620;--card:#13232f;--ink:#e6edf3;--mut:#8ea0b0;--line:#26394a;--in:#0d1b26;--teal:#4fb4d3}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
body>.logo{background:#fff;padding:calc(8px + env(safe-area-inset-top,0)) 14px 8px;display:flex;justify-content:center;border-bottom:1px solid #e3e8ed}
.logo img{height:42px;max-width:100%;object-fit:contain;display:block}
header{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0)) 14px 0;position:sticky;top:0;z-index:5}
header h1{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header .all{flex:none;background:#ffffff1a;color:#fff;border:1px solid #ffffff44;border-radius:6px;padding:5px 10px;font-size:12px}
.hd{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.hd input{background:#ffffff14;border:1px solid #ffffff2a;color:#fff;border-radius:6px;padding:6px 8px;font-size:13px;width:100%}
.hd input::placeholder{color:#ffffff88}
#tabs{display:flex;overflow-x:auto;margin:0 -14px;padding:0 14px}
#tabs button{flex:none;background:none;border:0;color:#9db3c6;padding:10px 12px;font-size:14px;border-bottom:3px solid transparent}
#tabs button.on{color:#fff;border-color:var(--amb);font-weight:700}
main{padding:12px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
h2{font-size:14px;margin:0 0 8px;color:var(--mut);font-weight:600}
.big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:16px;color:var(--mut);font-weight:500;margin-left:4px}
.top{display:flex;justify-content:space-between;align-items:flex-end}
.chip{padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700;color:#fff;background:var(--mut)}
.chip.ok{background:var(--ok)}.chip.bad{background:var(--bad)}
.gauge{position:relative;height:14px;background:var(--in);border:1px solid var(--line);border-radius:7px;margin:16px 0 8px}
.band{position:absolute;top:0;bottom:0;background:#1f8a5b44;border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
.tg{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ok)}
.nd{position:absolute;top:-8px;width:4px;height:30px;margin-left:-2px;background:var(--amb);border-radius:2px;outline:2px solid var(--card)}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}.kv b{color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{display:block;font-size:12px;color:var(--mut)}
input[data-k],textarea{width:100%;background:var(--in);border:1px solid var(--line);border-radius:6px;padding:9px 8px;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
input:focus,textarea:focus{outline:2px solid var(--amb);outline-offset:-1px}
.bp{display:flex;gap:16px;font-size:14px;margin:6px 0 2px}.bp b{font-size:18px;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--mut);margin:4px 0 0}
svg#sv{width:100%;display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
svg text{fill:var(--mut);font-size:9px}
.gr{stroke:var(--line);stroke-width:1}
.h{cursor:grab;touch-action:none}
table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--mut);text-align:left;font-weight:600}td{padding:3px 3px 3px 0}
details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--mut)}
.btns{display:flex;gap:8px;margin-top:8px}
.btns button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.btns .pri{background:var(--navy);color:#fff;border-color:var(--navy)}
</style></head><body>
